name: Run script and publish
on:
  schedule:
    - cron: "7 7-22 * * *"
    - cron: "37 7-22 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python FT_reader.py
      - run: |
          mkdir site
          cp *_today.html site/
          cat > site/index.html <<'EOF'
          <!DOCTYPE html><html><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Headlines</title></head><body>
          <h1>Headlines</h1>
          <p><a href="FT_today.html">FT</a></p>
          <p><a href="Bloomberg_today.html">Bloomberg</a></p>
          <p><a href="Economist_today.html">Economist</a></p>
          </body></html>
          EOF
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
